name: Build Windows

on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows.yml']
    tags: ['windows-v*']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 zip
      - name: Check that l10n.h matches the translations
        run: |
          cd windows
          cp l10n.h /tmp/l10n.h.committed
          python3 l10n/gen_l10n.py
          diff -u /tmp/l10n.h.committed l10n.h
      - name: Build Sawaruna.exe
        run: sh windows/build.sh
      - name: Package
        run: |
          mkdir -p out
          cp windows/Sawaruna.exe windows/README.md LICENSE out/
          cd out && zip -X Sawaruna-Windows.zip Sawaruna.exe README.md LICENSE
          sha256sum Sawaruna.exe Sawaruna-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Sawaruna-Windows
          path: out/Sawaruna-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Sawaruna-exe
          path: windows/Sawaruna.exe

  msix:
    # Microsoft Store package, made with the official Windows SDK tools
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Sawaruna-exe
          path: exe
      - name: Make the MSIX package
        shell: pwsh
        run: |
          $tool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter makeappx.exe |
            Where-Object { $_.DirectoryName -like '*\x64' -and (Test-Path (Join-Path $_.DirectoryName 'makepri.exe')) } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $tool) { Write-Error 'Windows SDK tools not found'; exit 1 }
          Write-Host "SDK tools: $($tool.DirectoryName)"
          $env:PATH = "$($tool.DirectoryName);$env:PATH"
          $ver = (Select-String -Path windows/sawaruna.c -Pattern 'APP_VERSION L"([0-9.]+)"').Matches[0].Groups[1].Value
          foreach ($kind in 'store', 'test') {
            $pyArgs = @('windows/msix/make_layout.py', 'exe/Sawaruna.exe', "layout-$kind", $ver)
            if ($kind -eq 'test') { $pyArgs += '--test' }
            python @pyArgs
            if ($LASTEXITCODE) { exit 1 }
            makepri createconfig /cf "priconfig-$kind.xml" /dq en-US /o
            makepri new /pr "layout-$kind" /cf "priconfig-$kind.xml" /of "layout-$kind/resources.pri" /o
            if ($LASTEXITCODE) { exit 1 }
          }
          makeappx pack /d layout-store /p Sawaruna.msix /o
          if ($LASTEXITCODE) { exit 1 }
          Compress-Archive -Path layout-test/* -DestinationPath Sawaruna-Store-test.zip
          Get-FileHash Sawaruna.msix, Sawaruna-Store-test.zip -Algorithm SHA256 | Format-List
      - name: Check that the package installs
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject ((Select-Xml -Path layout-store/AppxManifest.xml -XPath '//*[local-name()="Identity"]').Node.Publisher) -CertStoreLocation Cert:\CurrentUser\My
          $sign = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
            Where-Object { $_.DirectoryName -like '*\x64' } | Sort-Object FullName -Descending | Select-Object -First 1
          Copy-Item Sawaruna.msix check.msix
          & $sign.FullName sign /fd SHA256 /sha1 $cert.Thumbprint check.msix
          Export-Certificate -Cert $cert -FilePath check.cer | Out-Null
          Import-Certificate -FilePath check.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Add-AppxPackage check.msix
          Get-AppxPackage *Sawaruna* | Format-List Name, Version, Status, InstallLocation
          Remove-AppxPackage (Get-AppxPackage *Sawaruna*).PackageFullName
      - uses: actions/upload-artifact@v4
        with:
          name: Sawaruna-msix
          path: |
            Sawaruna.msix
            Sawaruna-Store-test.zip
